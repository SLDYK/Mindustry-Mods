apply plugin: "java"

// Mindustry 约定：Java 源码直接放在项目根的 src/ 下（不是 src/main/java）
sourceSets.main.java.srcDirs = ["src"]

ext{
    // 目标游戏版本，值定义在 gradle.properties 里，build.sh 也会读它
    mindustryVersion = project.findProperty("mindustryVersion") ?: "v159.7"
}

repositories{
    mavenCentral()

    // 官方依赖来源：从 Mindustry 的 GitHub Release 里取 dependencies.jar
    // 只在 libs/dependencies.jar 缺失时才会联网
    ivy{
        url = "https://github.com/"
        patternLayout{
            artifact "/[organisation]/[module]/releases/download/[revision]/dependencies.jar"
        }
        metadataSources{ artifact() }
        content{ includeVersion("Anuken", "Mindustry", mindustryVersion) }
    }
}

dependencies{
    // 本地依赖优先，这样完全离线；缺失时才回退到上面的 GitHub 源
    if(file("libs/dependencies.jar").exists()){
        compileOnly files("libs/dependencies.jar")
    }else{
        compileOnly "Anuken:Mindustry:$mindustryVersion"
    }
}

tasks.withType(JavaCompile).configureEach{
    options.encoding = "UTF-8"
    // v8 的类文件是 Java 17（major 61），用本地 JDK 21 编译成同一目标版本
    options.release = 17
}

jar{
    // jar 文件名不能有空格，所以用项目名（settings.gradle 里设的 EnemyPause）
    archiveFileName = "${project.name}.jar"

    // mod.hjson 必须位于 jar 根目录
    from(projectDir){ include "mod.hjson" }

    // 贴图等资源。
    // 注意 from(dir) 是把"目录内容"铺到 jar 根目录，所以源码里的
    // assets/sprites/foo.png 进 jar 后就变成 sprites/foo.png —— 这正是游戏期望的位置
    // （游戏按 sprites/ 目录读模组贴图，游戏内引用名是 "<模组内部名>-foo"）。
    from("assets/"){
        include "**"
        exclude "**/.gitkeep"
    }

    // 本地化文本。这里和 assets 不同：游戏按 bundles/ 目录读语言包，
    // 所以必须用 into("bundles") 把目录本身也带上，否则文件会落到 jar 根目录而失效。
    from("bundles/"){
        into("bundles")
        include "**"
        exclude "**/.gitkeep"
    }
}
