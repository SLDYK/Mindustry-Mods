# 默认语言包（英文）。
# 注意：DataBundleLoader 是按 "bundle" + (locale 为空 ? "" : "_" + locale) 匹配文件名的，
# 所以这里的默认包必须叫 bundle.properties —— 叫 bundle_en.properties 永远不会被加载。
keybind.enemy_pause.name = Pause Enemy Countdowns
keybind.enemy_pause_skip.name = Skip Enemy Countdown
enemy-pause.paused = Enemy countdowns paused (next wave / objectives)
enemy-pause.resumed = Enemy countdowns resumed
enemy-pause.unavailable = Only available in campaign games
enemy-pause.skipped = Enemy countdowns skipped
enemy-pause.skip.none = Nothing to skip right now
