# Default language bundle (English).
# NOTE: the default bundle MUST be named bundle.properties -- a file named bundle_en.properties
# is never loaded, because the loader looks for "bundle" + (locale.isEmpty() ? "" : "_" + locale).
#
# Key convention: per-content strings are prefixed with the full content name
# (e.g. erekir-items-tunable-node.output); shared UI words carry no content prefix
# (erekir-items.apply).

# ---- Tunable Power Node (tunable-node) ----
block.erekir-items-tunable-node.name = Tunable Power Node
block.erekir-items-tunable-node.description = A power node whose output can be set by the player. Feeds an adjustable amount of power into the grid. Erekir only, available from the start.
erekir-items-tunable-node.details = Tap the block to open the settings: type an exact output and press Apply, or use the preset buttons. Allowed range is 0 ~ {0} power/second. Double-tap the selected node to restore the default {1}/s.\n\nIt is a pure power source: it only feeds the grid and never draws from it. Connect it to the rest of the grid with beam nodes. It links automatically to the first powered building in each of the four cardinal directions, up to 12 tiles away.
erekir-items-tunable-node.output = Output (power/second)
stat.erekir-items-tunable-node-maxoutput = Max Output

# ---- Resource Source (resource-source) ----
block.erekir-items-resource-source.name = Resource Source
block.erekir-items-resource-source.description = A source that endlessly produces an item, a liquid and heat. The item and liquid types can be picked freely, and all three outputs have their own adjustable rate. No input and no mining needed. Erekir only, available from the start.
erekir-items-resource-source.details = Tap the block to set everything up.\n\n[accent]Item[] and [accent]liquid[]: click an icon in the grid to pick the type (click the selected one again to turn that output off).\n[accent]Rates[]: type a number and press Apply, or use the preset buttons. Ranges are 0 ~ {0} items/second, 0 ~ {1} units of water/second and 0 ~ {2} heat units. Double-tap the block to restore the defaults ({3}/s, {4}/s, no heat).\n\nIt only produces, never consumes. Send the items out with conveyors and the liquid with conduits; whatever is not taken just accumulates in its buffers, and output stops once they are full. Heat is different: it is handed over by [accent]adjacency[] only - place it right next to the building that needs the heat (electric heaters, heat-fed crafters, ...), and note that it does not travel through a heat conductor network like a router does.
erekir-items-resource-source.item = Item
erekir-items-resource-source.liquid = Liquid
erekir-items-resource-source.itemrate = Items/second
erekir-items-resource-source.liquidrate = Liquid/second
erekir-items-resource-source.heat = Heat output
erekir-items-resource-source.none = (none)
stat.erekir-items-resource-source-maxitemrate = Max Item Output
stat.erekir-items-resource-source-maxliquidrate = Max Liquid Output
stat.erekir-items-resource-source-maxheat = Max Heat Output

# ---- shared ----
erekir-items.apply = Apply
