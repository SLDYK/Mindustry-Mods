# Default language bundle (English).
# NOTE: the default bundle MUST be named bundle.properties -- a file named bundle_en.properties
# is never loaded, because the loader looks for "bundle" + (locale.isEmpty() ? "" : "_" + locale).
#
# Key convention: per-content strings are prefixed with the full content name
# (e.g. erekir-items-tunable-node.output); shared UI words carry no content prefix
# (erekir-items.apply).

# ---- Tunable Power Node (tunable-node) ----
block.erekir-items-tunable-node.name = Tunable Power Node
block.erekir-items-tunable-node.description = A power node whose output can be set by the player. Feeds an adjustable amount of power into the grid. Erekir only, available from the start.
erekir-items-tunable-node.details = Tap the block to open the settings: type an exact output and press Apply, or use the preset buttons. Allowed range is 0 ~ {0} power/second. Double-tap the selected node to restore the default {1}/s.\n\nIt is a pure power source: it only feeds the grid and never draws from it. Connect it to the rest of the grid with beam nodes. It links automatically to the first powered building in each of the four cardinal directions, up to 12 tiles away.
erekir-items-tunable-node.output = Output (power/second)
stat.erekir-items-tunable-node-maxoutput = Max Output

# ---- Resource Source (resource-source) ----
block.erekir-items-resource-source.name = Resource Source
block.erekir-items-resource-source.description = A source that endlessly produces phase fabric and water. No input and no mining needed. Erekir only, available from the start.
erekir-items-resource-source.details = Tap the block to set both outputs: type a number and press Apply, or use the preset buttons. Ranges are 0 ~ {0} phase fabric/second and 0 ~ {1} water/second. Double-tap the block to restore the defaults ({2}/s + {3}/s).\n\nIt only produces, never consumes. Send the items out with conveyors and the water with conduits; whatever is not taken just accumulates in its buffers, and output stops once they are full.
erekir-items-resource-source.itemrate = Phase fabric (items/second)
erekir-items-resource-source.liquidrate = Water (units/second)
stat.erekir-items-resource-source-itemrate = Max Phase Fabric Output
stat.erekir-items-resource-source-liquidrate = Max Water Output

# ---- shared ----
erekir-items.apply = Apply
