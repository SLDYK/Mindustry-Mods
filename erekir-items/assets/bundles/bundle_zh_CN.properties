block.erekir-items-tunable-node.name = 可调电力节点
block.erekir-items-tunable-node.description = 输出功率由玩家自行设置的电力节点，可以往电网里灌注指定的电量。仅埃里克尔可用，开局即可建造。
erekir-items.details = 点开方块即可设置：在输入框里填具体数值后按「应用」，或者直接点快捷按钮。可填范围 0 ~ {0} 电力/秒。双击已选中的节点可恢复默认的 {1} 电力/秒。\n\n它是纯电源：只往电网里送电，不从电网取电。用光束节点把它接进电网即可使用；它会自动连接四个正方向上 12 格内第一个带电网的建筑。

stat.erekir-items-maxoutput = 最大输出
erekir-items.output = 输出功率（电力/秒）
erekir-items.apply = 应用
