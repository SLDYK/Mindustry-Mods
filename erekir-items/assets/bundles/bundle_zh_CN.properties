# 简体中文语言包（游戏按 UTF-8 读取，可直接写中文）。
# 默认语言包是 bundle.properties，本文件只覆盖中文。
#
# 键名约定：每个内容自己的文案以「完整内容名」开头
# （如 erekir-items-tunable-node.output）；跟内容无关的共用界面词不带内容前缀
# （erekir-items.apply）。

# ---- 可调电力节点（tunable-node）----
block.erekir-items-tunable-node.name = 可调电力节点
block.erekir-items-tunable-node.description = 输出功率由玩家自行设置的电力节点，可以往电网里灌注指定的电量。仅埃里克尔可用，开局即可建造。
erekir-items-tunable-node.details = 点开方块即可设置：在输入框里填具体数值后按「应用」，或者直接点快捷按钮。可填范围 0 ~ {0} 电力/秒。双击已选中的节点可恢复默认的 {1} 电力/秒。\n\n它是纯电源：只往电网里送电，不从电网取电。用光束节点把它接进电网即可使用；它会自动连接四个正方向上 12 格内第一个带电网的建筑。
erekir-items-tunable-node.output = 输出功率（电力/秒）
stat.erekir-items-tunable-node-maxoutput = 最大输出

# ---- 资源源（resource-source）----
block.erekir-items-resource-source.name = 资源源
block.erekir-items-resource-source.description = 源源不断地产出物品、液体和热量的资源源：物品与液体的种类可以随意挑，三种输出各自的速率也都能调。不需要任何输入，也不用采矿。仅埃里克尔可用，开局即可建造。
erekir-items-resource-source.details = 点开方块就能把三种输出都设好。\n\n[accent]物品[]与[accent]液体[]：在图标格里点一下即可选定种类（再点一次已选中的图标就是关掉这一路输出）。\n[accent]速率[]：在输入框里填数值后按「应用」，或者直接点快捷按钮。可填范围：物品 0 ~ {0} 个/秒、液体 0 ~ {1} 单位/秒、热量 0 ~ {2}。双击方块可恢复默认值（{3} 个/秒、{4} 单位/秒、不开热）。\n\n它只产出、不消耗。物品用传送带接走，液体用管道接走；没被接走的部分就堆在它的仓里，堆满后自动停产。热量不一样：[accent]只能挨着传[]，所以要把它紧贴着需要热的建筑放（电热器、耗热的工厂之类）；它不能像热量分配器那样把热送到远处。
erekir-items-resource-source.item = 物品
erekir-items-resource-source.liquid = 液体
erekir-items-resource-source.itemrate = 物品速率
erekir-items-resource-source.liquidrate = 液体速率
erekir-items-resource-source.heat = 热量输出
erekir-items-resource-source.none = （无）
stat.erekir-items-resource-source-maxitemrate = 物品产出上限
stat.erekir-items-resource-source-maxliquidrate = 液体产出上限
stat.erekir-items-resource-source-maxheat = 热量输出上限

# ---- 共用 ----
erekir-items.apply = 应用
