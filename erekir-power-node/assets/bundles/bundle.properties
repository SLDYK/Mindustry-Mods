# Default language bundle (English).
# NOTE: the default bundle MUST be named bundle.properties -- a file named bundle_en.properties
# is never loaded, because the loader looks for "bundle" + (locale.isEmpty() ? "" : "_" + locale).

block.erekir-power-node-tunable-node.name = Tunable Power Node
block.erekir-power-node-tunable-node.description = A power node whose output can be set by the player. Feeds an adjustable amount of power into the grid. Erekir only, available from the start.
erekir-power-node.details = Tap the block to open the settings: type an exact output and press Apply, or use the preset buttons. Allowed range is 0 ~ {0} power/second. Double-tap the selected node to restore the default {1}/s.\n\nIt is a pure power source: it only feeds the grid and never draws from it. Connect it to the rest of the grid with beam nodes. It links automatically to the first powered building in each of the four cardinal directions, up to 12 tiles away.

stat.erekir-power-node-maxoutput = Max Output
erekir-power-node.output = Output (power/second)
erekir-power-node.apply = Apply
